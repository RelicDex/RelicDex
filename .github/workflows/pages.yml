name: Publish Pokémon Relics Ultimate — 450-species public RelicDex
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: relicdex-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Check out RelicDex repository
        uses: actions/checkout@v4
      - name: Restore approved Beta 3 website
        run: |
          echo "6443d74c1c73de2d753cc7bb1387702b0c76bc880d91e365f5cb5ac54311ce1b  archive/relicdex-beta3.zip" | sha256sum -c -
          mkdir -p relicdex-src
          unzip -q archive/relicdex-beta3.zip -d relicdex-src
      - name: Check out pinned vanilla Pokesprite fork
        uses: actions/checkout@v4
        with:
          repository: jamesthoward2112-tech/pokesprite
          ref: c5aaa610ff2acdf7fd8e2dccd181bca8be9fcb3e
          path: _donors/pokesprite
          sparse-checkout: pokemon-gen8
      - name: Check out pinned Relic Legacy sprite donor
        uses: actions/checkout@v4
        with:
          repository: jamesthoward2112-tech/Pokemon-Relic-Legacy
          ref: 6ee9b984521ac6f2beaf995f771a726379e55c88
          path: _donors/prl
          sparse-checkout: graphics/pokemon
      - name: Check out source-locked PJR Hoenn legendary art
        uses: actions/checkout@v4
        with:
          repository: jamesthoward2112-tech/Pokemon-Johto-Relics
          ref: 9e9ec181961efbbdba88055876dfa9b18fd0ae64
          path: _donors/pjr
          sparse-checkout: |
            graphics/pokemon/regirock
            graphics/pokemon/regice
            graphics/pokemon/registeel
            graphics/pokemon/latias
            graphics/pokemon/latios
            graphics/pokemon/kyogre
            graphics/pokemon/groudon
            graphics/pokemon/rayquaza
            graphics/pokemon/jirachi
      - name: Check out pinned Radical Red Seviian battle art
        uses: actions/checkout@v4
        with:
          repository: JwowSquared/Radical-Red-Pokedex
          ref: 488a0918194d567b5f7b02c396118d51fb9c81ce
          path: _donors/rr
          sparse-checkout: |
            graphics/species/front
            graphics/species/back
            graphics/species/front shiny
            graphics/species/back shiny
      - name: Check out verified PRU sprite and evolution source
        uses: actions/checkout@v4
        with:
          repository: jamesthoward2112-tech/Pokemon-Johto-Relics
          ref: 2f7122d692f676ac14665e43f7d0f5477d7ad59e
          path: _donors/pru
          sparse-checkout: |
            graphics/pokemon/noxichu
            assets/pru_title
            src/data/pokemon/species_info
      - name: Bundle vanilla and approved custom sprites and validate assets
        run: |
          python3 relicdex-src/scripts/bundle_assets.py --pokesprite _donors/pokesprite --prl _donors/prl --out _site
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('_site')
          mons=json.loads((p/'data/pokemon.json').read_text())
          assert len(mons)==444, f'Expected 444 Pokémon, found {len(mons)}'
          sprites=[v for m in mons for v in m.get('sprite',{}).values() if v]
          assert all(not v.startswith(('http:','https:')) for v in sprites), 'Remote sprite URLs remain'
          assert all((p/v).is_file() for v in sprites), 'Referenced sprites missing'
          print(f'Validated {len(mons)} Pokémon, {len(sprites)} local sprite references')
          PY
      - name: Apply 18 October PRU updates to RelicDex
        run: |
          python3 scripts/apply_pru_updates.py --site _site
          python3 - <<'PY'
          import json
          from pathlib import Path
          site = Path('_site')
          mons = json.loads((site / 'data/pokemon.json').read_text())
          assert len(mons) == 444
          assert len([m for m in mons if m.get('name') == 'Valkiri']) == 1
          paths = [v for m in mons for v in m.get('sprite', {}).values() if isinstance(v, str) and v]
          assert all(not v.startswith(('http:', 'https:')) for v in paths)
          assert all((site / v).is_file() for v in paths)
          assert (site / 'updates.html').is_file()
          print(f'Post-update: {len(mons)} entries, {len(paths)} local sprite links, PRU update page available')
          PY
      - name: Import verified Radical Red forms and protected PRL legendary sprites
        run: |
          python3 -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
          python3 scripts/port_seviian_and_approved_legends.py --site _site --rr _donors/rr --prl _donors/prl
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('_site')
          mons=json.loads((root/'data/pokemon.json').read_text())
          assert len(mons)==444
          x={m['name']:m for m in mons}
          for name in ('Noibat (Sevii)','Noivern (Sevii)'):
              m=x[name]
              assert m['types']==['Rock','Ghost']
              assert 'Radical Red' in m['spriteProvenance']
              for k in ('front','back','shiny'):assert (root/m['sprite'][k]).is_file()
          for name in ('Raikou','Entei','Suicune','Lugia','Ho-Oh','Celebi'):
              m=x[name]
              assert 'Protected PRL/PJR' in m['spriteProvenance']
              for k in ('front','back','shiny'):assert (root/m['sprite'][k]).is_file()
          for name in ('Articuno','Zapdos','Moltres','Mewtwo','Deoxys'):
              assert x[name]['sprite'].get('front')
          print('Verified original Radical Red front/back/shiny artwork and source-pinned Relic legend sets')
          PY
      - name: Import remaining PJR Hoenn legendary sprite sets
        run: |
          python3 scripts/port_pjr_hoenn_legends.py --site _site --pjr _donors/pjr
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('_site')
          mons=json.loads((p/'data/pokemon.json').read_text())
          assert len(mons)==444
          byname={m['name']:m for m in mons}
          wanted=('Regirock','Regice','Registeel','Latias','Latios','Kyogre','Groudon','Rayquaza','Jirachi')
          for name in wanted:
              sprite=byname[name]['sprite']
              assert 'Verified original PJR' in byname[name]['spriteProvenance']
              for kind in ('front','back','shiny','icon'):
                  assert (p/sprite[kind]).is_file(), (name,kind)
          assert 'PokéSprite' in byname['Mew']['spriteProvenance']
          assert (p/'data/pjr_legendary_art_audit.json').is_file()
          print('Verified all 9 original PJR species fronts, backs, shinies and icons; Mew unchanged.')
          PY
      - name: Repair all 444 evolution links and normalize sprite previews
        run: |
          python3 -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
          python3 scripts/repair_relicdex.py --site _site --pru _donors/pru
          python3 - <<'PY'
          import json
          from pathlib import Path
          site=Path('_site')
          mons=json.loads((site/'data/pokemon.json').read_text())
          assert len(mons)==444
          byname={m['name']:m for m in mons}
          mightyena=byname['Mightyena']
          skull=byname['Skulberus']
          assert any(r.get('targetConstant')=='SPECIES_SKULBERUS' and r.get('method')=='Ancient Stone' and r.get('requirement')=='Level 45+' for r in mightyena['evolutions'])
          assert any(r['source']=='Mightyena' for r in skull['evolvesFrom'])
          assert 'verified PRU source' in byname['Noxichu']['spriteProvenance']
          for m in mons:
              for k in ('front','shiny','back'):
                  p=m['sprite'].get(k)
                  if p: assert (site/p).is_file(), (m['name'],k,p)
          assert (site/'data/sprite_evolution_audit.json').exists()
          print('Verified 444 entries, source-matched evolutions, approved art and local normalized sprite previews')
          PY
      - name: Publish PRU game website and approved title artwork
        run: |
          python3 scripts/publish_pru_site.py --site _site --pru _donors/pru
          test -f _site/pru/index.html
          test -f _site/pru/about/index.html
          test -f _site/pru/media/title-screen.png
      - name: Publish current PRU 450 RelicDex with trainer teams
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          parts = sorted(Path('public/source').glob('part-*.txt'))
          assert len(parts) == 13, f'Expected 13 PRU Job 15 HTML fragments; found {len(parts)}'
          source = ''.join(p.read_text(encoding='utf-8') for p in parts)
          assert source.lower().count('</body>') == 1
          m = re.search(r'<script id="data" type="application/json">(.+?)</script>', source, re.S)
          assert m, 'RelicDex dataset missing'
          dataset = json.loads(m.group(1))
          assert len(dataset['mons']) == 450, 'Not the current 450-species RelicDex'
          teams = Path('public/trainer_data.js').read_text(encoding='utf-8')
          patch = Path('public/public_patch.js').read_text(encoding='utf-8')
          visual_paths = [
              'public/visual_pokemon.js',
              'public/visual_trainers_1.js',
              'public/visual_trainers_2.js',
              'public/visual_trainers_3.js',
              'public/visual_ritual.js',
          ]
          visuals = [Path(p).read_text(encoding='utf-8') for p in visual_paths]
          processing = Path('public/visual_processing.js').read_text(encoding='utf-8')
          overrides = Path('public/pokemon_overrides.js').read_text(encoding='utf-8')
          elite18 = Path('public/elite18_gallery.js').read_text(encoding='utf-8')
          assert 'window.__PRU_PUBLIC_TRAINERS=' in teams
          assert 'Every Pokémon used across recorded battles' in patch
          assert 'Official PRU download coming soon' in patch
          assert 'View PRU game releases' not in patch
          assert 'window.__PRU_VISUAL_POKEMON=' in visuals[0]
          assert 'window.__PRU_ENEMY_ONLY_ART' in processing
          assert all('</script>' not in x for x in [teams, *visuals, overrides, patch, processing, elite18])
          chunks = [teams, *visuals, overrides, patch, processing, elite18]
          addon = ''.join('<script>\n' + chunk + '\n</script>' for chunk in chunks)
          html = source.replace('</body>', addon + '</body>')
          output = Path('_site/index.html')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(html, encoding='utf-8')
          import shutil
          custom_pngs = sorted(Path('public/assets/pru-art').rglob('*.png'))
          assert len(custom_pngs) == 6, 'Expected two PRU Dex overrides and four Elite 18 sprite assets'
          for asset in custom_pngs:
              destination = Path('_site') / asset.relative_to('public')
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(asset, destination)
          from PIL import Image
          assert all(Image.open(Path('_site') / asset.relative_to('public')).convert('RGBA').getchannel('A').getextrema()[0] == 0 for asset in custom_pngs)
          assert output.stat().st_size > 6_000_000
          print(f'Published 450 Pokémon, current front sprites and public trainer guide ({output.stat().st_size} bytes)')
          PY
      - name: Attempt one-time GitHub Pages activation
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow || echo "Pages may need enabling once under Settings > Pages > Source: GitHub Actions."
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish website
        uses: actions/deploy-pages@v4
        id: deployment
